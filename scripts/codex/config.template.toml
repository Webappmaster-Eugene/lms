# Generated machine paths/MCP/hooks are appended by pnpm codex:sync.
# Project-scoped only; does not change ~/.codex or credentials.
approval_policy = "never"
default_permissions = "lms"
web_search = "live"
project_doc_max_bytes = 65536
# Parity with Claude effortLevel = "high".
model_reasoning_effort = "high"
# Parity with Claude autoCompactWindow = 600000: the window is capped at 600k and
# compaction starts at 90% of it, before the effective limit (95%) is reached.
model_context_window = 600000
model_auto_compact_token_limit = 540000

[features]
hooks = true
multi_agent = true

[agents]
enabled = true
# review_multi runs five rev-* reviewers side by side.
max_concurrent_threads_per_session = 6

[permissions.lms]
description = "Full project access, Git, agent configuration and network"
extends = ":workspace"

[permissions.lms.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"
".codex" = "write"
".agents" = "write"
"app/.git" = "write"
"app/.codex" = "write"
"app/.agents" = "write"

[permissions.lms.network]
enabled = true

[permissions.lms-review]
description = "Read-only review with network access for GitHub feedback"
extends = ":read-only"

[permissions.lms-review.network]
enabled = true

[shell_environment_policy]
inherit = "all"
