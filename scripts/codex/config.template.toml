# Generated machine paths/MCP/hooks are appended by pnpm codex:sync.
# Project-scoped only; does not change ~/.codex or credentials.
approval_policy = "never"
default_permissions = "lms"
web_search = "live"
project_doc_max_bytes = 65536

[features]
hooks = true
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[permissions.lms]
description = "Full project access, Git, agent configuration and network"
extends = ":workspace"

[permissions.lms.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"
".codex" = "write"
".agents" = "write"
"app/.git" = "write"
"app/.codex" = "write"
"app/.agents" = "write"

[permissions.lms.network]
enabled = true

[permissions.lms-review]
description = "Read-only review with network access for GitHub feedback"
extends = ":read-only"

[permissions.lms-review.network]
enabled = true

[shell_environment_policy]
inherit = "all"
