x-trainer-image: &trainer-image
  restart: unless-stopped
  entrypoint: ["node", "-e", "setInterval(() => {}, 2147483647)"]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  network_mode: none
  labels:
    - traefik.enable=false
  deploy:
    resources:
      limits:
        memory: 64M

services:
  lms-mentor-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms_platform
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - lms-pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  lms-mentor-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [lms-cache]
    tmpfs:
      - /data:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-https://learn.mentorcareer.ru}
        - SENTRY_RELEASE=${SENTRY_RELEASE:-}
        - SENTRY_URL=${SENTRY_URL:-}
        - SENTRY_ORG=${SENTRY_ORG:-}
        - SENTRY_PROJECT=${SENTRY_PROJECT:-}
      # Токен загрузки source maps — секретом сборки, а не аргументом: аргументы видны в истории образа.
      secrets: [sentry_auth_token]
    restart: unless-stopped
    depends_on:
      lms-mentor-db:
        condition: service_healthy
      lms-mentor-otel:
        condition: service_started
      lms-mentor-trainer-runtime:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://lms:${DB_PASSWORD:-changeme}@lms-mentor-db:5432/lms_platform
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - INTERVIEW_ANALYSIS_API_URL=${INTERVIEW_ANALYSIS_API_URL:-}
      - INTERVIEW_ANALYSIS_API_TOKEN=${INTERVIEW_ANALYSIS_API_TOKEN:-}
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN:-}
      - YANDEX_INTERVIEWS_ROOT=${YANDEX_INTERVIEWS_ROOT:-disk:/LMS interviews}
      - TRAINER_RUNTIME_URL=${TRAINER_RUNTIME_URL:-http://lms-mentor-trainer-runtime:3100}
      - TRAINER_RUNTIME_TOKEN=${TRAINER_RUNTIME_TOKEN:-}
      - TRAINER_RUNTIME_TOKEN_FILE=/trainer-auth/token
      - REDIS_URL=${REDIS_URL-redis://lms-mentor-redis:6379}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-https://learn.mentorcareer.ru}
      # Initial admin (required on first launch with empty DB)
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@mentorcareer.ru}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-MentorCareer}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - ROBOKASSA_MERCHANT_LOGIN=${ROBOKASSA_MERCHANT_LOGIN:-}
      - ROBOKASSA_PASSWORD1=${ROBOKASSA_PASSWORD1:-}
      - ROBOKASSA_PASSWORD2=${ROBOKASSA_PASSWORD2:-}
      - ROBOKASSA_PASSWORD3=${ROBOKASSA_PASSWORD3:-}
      - ROBOKASSA_TEST_PASSWORD1=${ROBOKASSA_TEST_PASSWORD1:-}
      - ROBOKASSA_TEST_PASSWORD2=${ROBOKASSA_TEST_PASSWORD2:-}
      - ROBOKASSA_IS_TEST=${ROBOKASSA_IS_TEST:-1}
      - ROBOKASSA_HASH=${ROBOKASSA_HASH:-sha256}
      # Sentry: без SENTRY_DSN отчёты об ошибках выключены (и сервер, и туннель браузера)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_BROWSER_DSN=${SENTRY_BROWSER_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://lms-mentor-otel:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-lms-platform}
      - PUSH_VAPID_PUBLIC_KEY=${PUSH_VAPID_PUBLIC_KEY:-}
      - PUSH_VAPID_PRIVATE_KEY=${PUSH_VAPID_PRIVATE_KEY:-}
      - PUSH_VAPID_SUBJECT=${PUSH_VAPID_SUBJECT:-https://learn.mentorcareer.ru}
      - LMS_TRUST_PROXY=${LMS_TRUST_PROXY:-false}
      - LMS_GEOIP_DATABASE_PATH=${LMS_GEOIP_DATABASE_PATH:-/geoip/dbip-city-lite.mmdb}
    volumes:
      - lms-media:/app/media
      - lms-geoip:/geoip:ro
      - lms-trainer-auth:/trainer-auth:ro
    networks:
      - dokploy-network
      - lms-cache
      - lms-trainer
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Держат ссылки на job images: очистка завершённых контейнеров не должна удалять среды задач.
  lms-mentor-trainer-go-image:
    <<: *trainer-image
    image: ${TRAINER_GO_JOB_IMAGE:-lms-trainer-go:local}
    build:
      context: ./trainer-runtime
      target: go-job

  lms-mentor-trainer-python-image:
    <<: *trainer-image
    image: ${TRAINER_PYTHON_JOB_IMAGE:-lms-trainer-python:local}
    build:
      context: ./trainer-runtime
      target: python-job

  lms-mentor-trainer-frontend-image:
    <<: *trainer-image
    image: ${TRAINER_FRONTEND_JOB_IMAGE:-lms-trainer-frontend:local}
    build:
      context: ./trainer-runtime
      target: frontend-job

  lms-mentor-trainer-next-image:
    <<: *trainer-image
    image: ${TRAINER_NEXT_JOB_IMAGE:-lms-trainer-next:local}
    build:
      context: ./trainer-runtime
      dockerfile: Dockerfile.next

  lms-mentor-trainer-auth:
    build:
      context: ./trainer-runtime
      target: gateway
    restart: "no"
    user: "0:1001"
    entrypoint: ["node", "/runtime/auth-token.mjs", "init"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    environment:
      - TRAINER_RUNTIME_TOKEN_FILE=/trainer-auth/token
    volumes:
      - lms-trainer-auth:/trainer-auth
    network_mode: none
    labels:
      - traefik.enable=false
    deploy:
      resources:
        limits:
          memory: 64M

  lms-mentor-trainer-runtime:
    build:
      context: ./trainer-runtime
      target: gateway
    restart: unless-stopped
    user: "0:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      lms-mentor-trainer-auth:
        condition: service_completed_successfully
      lms-mentor-trainer-go-image:
        condition: service_started
      lms-mentor-trainer-python-image:
        condition: service_started
      lms-mentor-trainer-frontend-image:
        condition: service_started
      lms-mentor-trainer-next-image:
        condition: service_started
    environment:
      - TRAINER_RUNTIME_TOKEN=${TRAINER_RUNTIME_TOKEN:-}
      - TRAINER_RUNTIME_TOKEN_FILE=/trainer-auth/token
      - TRAINER_GO_JOB_IMAGE=${TRAINER_GO_JOB_IMAGE:-lms-trainer-go:local}
      - TRAINER_PYTHON_JOB_IMAGE=${TRAINER_PYTHON_JOB_IMAGE:-lms-trainer-python:local}
      - TRAINER_FRONTEND_JOB_IMAGE=${TRAINER_FRONTEND_JOB_IMAGE:-lms-trainer-frontend:local}
      - TRAINER_NEXT_JOB_IMAGE=${TRAINER_NEXT_JOB_IMAGE:-lms-trainer-next:local}
      - TRAINER_MAX_CONCURRENT=${TRAINER_MAX_CONCURRENT:-1}
    # Docker socket доступен только доверенному gateway, не LMS и не решениям.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - lms-trainer-auth:/trainer-auth:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [lms-trainer]
    labels:
      - traefik.enable=false
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "import {readRuntimeToken} from '/runtime/auth-token.mjs';const token=process.env.TRAINER_RUNTIME_TOKEN||readRuntimeToken(process.env.TRAINER_RUNTIME_TOKEN_FILE);fetch('http://127.0.0.1:3100/health',{headers:{authorization:'Bearer '+token}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-geoip:
    image: node:22-alpine
    command: ["node", "/app/geoip-refresh.mjs"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      - LMS_GEOIP_DIRECTORY=/geoip
    volumes:
      - ./scripts/geoip-refresh.mjs:/app/geoip-refresh.mjs:ro
      - lms-geoip:/geoip
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('/geoip/metadata.json'));process.exit(Date.now()-Date.parse(m.refreshedAt)<90*86400000&&fs.statSync('/geoip/dbip-city-lite.mmdb').size>1024?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-notifications:
    image: node:22-alpine
    command: ["node", "/app/notification-scheduler.mjs"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      lms-mentor-app:
        condition: service_healthy
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - LMS_NOTIFICATION_APP_URL=http://lms-mentor-app:3000
    volumes:
      - ./scripts/notification-scheduler.mjs:/app/notification-scheduler.mjs:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/notifications-heartbeat','utf8'))<900000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-interviews:
    image: node:22-alpine
    command: ["node", "/app/interview-scheduler.mjs"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      lms-mentor-app:
        condition: service_healthy
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - LMS_INTERVIEW_APP_URL=http://lms-mentor-app:3000
    volumes:
      - ./scripts/interview-scheduler.mjs:/app/interview-scheduler.mjs:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/interviews-heartbeat','utf8'))<300000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-otel:
    build:
      context: ./observability
      dockerfile: Dockerfile.collector
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - GOMEMLIMIT=144MiB
      - LMS_PROMETHEUS_REMOTE_WRITE_ENDPOINT=${LMS_PROMETHEUS_REMOTE_WRITE_ENDPOINT:-http://prometheus:9090/api/v1/write}
      - LMS_LOKI_OTLP_ENDPOINT=${LMS_LOKI_OTLP_ENDPOINT:-http://loki:3100/otlp}
      - LMS_TEMPO_OTLP_GRPC_ENDPOINT=${LMS_TEMPO_OTLP_GRPC_ENDPOINT:-tempo:4317}
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-landing:
    build:
      context: ./landing
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lms-pgdata:
  lms-media:
  lms-geoip:
  lms-trainer-auth:

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

networks:
  lms-cache:
    internal: true
  lms-trainer:
    internal: true
  dokploy-network:
    external: true
