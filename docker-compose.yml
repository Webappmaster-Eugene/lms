services:
  lms-mentor-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms_platform
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - lms-pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  lms-mentor-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [lms-cache]
    tmpfs:
      - /data:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-https://learn.mentorcareer.ru}
    restart: unless-stopped
    depends_on:
      lms-mentor-db:
        condition: service_healthy
      lms-mentor-otel:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://lms:${DB_PASSWORD:-changeme}@lms-mentor-db:5432/lms_platform
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - YANDEX_DISK_TOKEN=${YANDEX_DISK_TOKEN:-}
      - YANDEX_INTERVIEWS_ROOT=${YANDEX_INTERVIEWS_ROOT:-disk:/LMS interviews}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MEETING_STT_MODEL=${MEETING_STT_MODEL:-google/gemini-3.1-pro-preview}
      - MEETING_STT_MODEL_FALLBACKS=${MEETING_STT_MODEL_FALLBACKS:-google/gemini-2.5-pro,google/gemini-2.5-flash}
      - STT_PIN_VERTEX_AI=${STT_PIN_VERTEX_AI:-true}
      - INTERVIEW_EVAL_MODEL=${INTERVIEW_EVAL_MODEL:-anthropic/claude-sonnet-5.5}
      - TRAINER_RUNTIME_URL=${TRAINER_RUNTIME_URL:-}
      - TRAINER_RUNTIME_TOKEN=${TRAINER_RUNTIME_TOKEN:-}
      - REDIS_URL=${REDIS_URL-redis://lms-mentor-redis:6379}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-https://learn.mentorcareer.ru}
      # Initial admin (required on first launch with empty DB)
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@mentorcareer.ru}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-MentorCareer}
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://lms-mentor-otel:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-lms-platform}
      - PUSH_VAPID_PUBLIC_KEY=${PUSH_VAPID_PUBLIC_KEY:-}
      - PUSH_VAPID_PRIVATE_KEY=${PUSH_VAPID_PRIVATE_KEY:-}
      - PUSH_VAPID_SUBJECT=${PUSH_VAPID_SUBJECT:-https://learn.mentorcareer.ru}
      - LMS_TRUST_PROXY=${LMS_TRUST_PROXY:-false}
      - LMS_GEOIP_DATABASE_PATH=${LMS_GEOIP_DATABASE_PATH:-/geoip/dbip-city-lite.mmdb}
    volumes:
      - lms-media:/app/media
      - lms-geoip:/geoip:ro
    networks:
      - dokploy-network
      - lms-cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  lms-mentor-geoip:
    image: node:22-alpine
    command: ["node", "/app/geoip-refresh.mjs"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      - LMS_GEOIP_DIRECTORY=/geoip
    volumes:
      - ./scripts/geoip-refresh.mjs:/app/geoip-refresh.mjs:ro
      - lms-geoip:/geoip
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('/geoip/metadata.json'));process.exit(Date.now()-Date.parse(m.refreshedAt)<90*86400000&&fs.statSync('/geoip/dbip-city-lite.mmdb').size>1024?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-notifications:
    image: node:22-alpine
    command: ["node", "/app/notification-scheduler.mjs"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      lms-mentor-app:
        condition: service_healthy
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - LMS_NOTIFICATION_APP_URL=http://lms-mentor-app:3000
    volumes:
      - ./scripts/notification-scheduler.mjs:/app/notification-scheduler.mjs:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/notifications-heartbeat','utf8'))<900000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-interviews:
    image: node:22-alpine
    command: ["node", "/app/interview-scheduler.mjs"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      lms-mentor-app:
        condition: service_healthy
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - LMS_INTERVIEW_APP_URL=http://lms-mentor-app:3000
    volumes:
      - ./scripts/interview-scheduler.mjs:/app/interview-scheduler.mjs:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/interviews-heartbeat','utf8'))<300000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-otel:
    build:
      context: ./observability
      dockerfile: Dockerfile.collector
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - GOMEMLIMIT=144MiB
      - LMS_PROMETHEUS_REMOTE_WRITE_ENDPOINT=${LMS_PROMETHEUS_REMOTE_WRITE_ENDPOINT:-http://prometheus:9090/api/v1/write}
      - LMS_LOKI_OTLP_ENDPOINT=${LMS_LOKI_OTLP_ENDPOINT:-http://loki:3100/otlp}
      - LMS_TEMPO_OTLP_GRPC_ENDPOINT=${LMS_TEMPO_OTLP_GRPC_ENDPOINT:-tempo:4317}
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-landing:
    build:
      context: ./landing
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lms-pgdata:
  lms-media:
  lms-geoip:

networks:
  lms-cache:
    internal: true
  dokploy-network:
    external: true
