services:
  lms-mentor-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lms_platform
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - lms-pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  lms-mentor-app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-https://learn.mentorcareer.ru}
    restart: unless-stopped
    depends_on:
      lms-mentor-db:
        condition: service_healthy
      lms-mentor-otel:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://lms:${DB_PASSWORD:-changeme}@lms-mentor-db:5432/lms_platform
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-https://learn.mentorcareer.ru}
      # Initial admin (required on first launch with empty DB)
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-noreply@mentorcareer.ru}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-MentorCareer}
      # OpenTelemetry
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://lms-mentor-otel:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-lms-platform}
      - PUSH_VAPID_PUBLIC_KEY=${PUSH_VAPID_PUBLIC_KEY:-}
      - PUSH_VAPID_PRIVATE_KEY=${PUSH_VAPID_PRIVATE_KEY:-}
      - PUSH_VAPID_SUBJECT=${PUSH_VAPID_SUBJECT:-https://learn.mentorcareer.ru}
    volumes:
      - lms-media:/app/media
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  lms-mentor-notifications:
    image: node:22-alpine
    command: ["node", "/app/notification-scheduler.mjs"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      lms-mentor-app:
        condition: service_healthy
    environment:
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - LMS_NOTIFICATION_APP_URL=http://lms-mentor-app:3000
    volumes:
      - ./scripts/notification-scheduler.mjs:/app/notification-scheduler.mjs:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks: [dokploy-network]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/notifications-heartbeat','utf8'))<900000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-otel:
    build:
      context: ./observability
      dockerfile: Dockerfile.collector
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - GOMEMLIMIT=144MiB
      - LMS_PROMETHEUS_REMOTE_WRITE_ENDPOINT=${LMS_PROMETHEUS_REMOTE_WRITE_ENDPOINT:-http://prometheus:9090/api/v1/write}
      - LMS_LOKI_OTLP_ENDPOINT=${LMS_LOKI_OTLP_ENDPOINT:-http://loki:3100/otlp}
      - LMS_TEMPO_OTLP_GRPC_ENDPOINT=${LMS_TEMPO_OTLP_GRPC_ENDPOINT:-tempo:4317}
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lms-mentor-landing:
    build:
      context: ./landing
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lms-pgdata:
  lms-media:

networks:
  dokploy-network:
    external: true
