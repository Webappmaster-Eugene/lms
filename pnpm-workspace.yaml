allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Нативный watcher, пришёл транзитивно с tailwindcss 4.3. Без разрешения на сборку
  # pnpm печатает предупреждение на каждой установке, в том числе внутри Docker.
  '@parcel/watcher': true
  # Нативный модуль V8-изолятов для серверной перепроверки решений тренажёра.
  # Готовых бинарников под все связки Node/ABI нет — собирается из исходников,
  # поэтому в Dockerfile для стадии deps добавлены python3/make/g++.
  isolated-vm: true
