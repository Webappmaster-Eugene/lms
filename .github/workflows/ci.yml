name: CI

# Проверки на каждый PR и push в main. Сам деплой делает Dokploy по push в main —
# этот workflow его не запускает и не блокирует, но красный CI — повод не мержить.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Раннеры свои: ci-lms-1/2 в изолированной VM ci на домашнем сервере serverlink (с 20.10.2026).
# PR из форков чужой код на них не исполняют: такие PR идут на ubuntu-latest (для публичного
# репозитория бесплатно), а запуск для внешних участников требует одобрения в настройках репозитория.
# Два прогона могут идти на одной VM одновременно, поэтому джобы не занимают порты хоста:
# БД и браузеры живут в контейнерах со своей сетью, а trainer-runtime с общими тегами образов
# и lms-test-pg:55433 выстроен в одну очередь.
# Установка зависимостей — через scripts/ci-install.mjs: таймаут и повтор, если загрузка из
# реестра npm замирает (бывает на канале МТС).

env:
  NEXT_TELEMETRY_DISABLED: '1'
  ASTRO_TELEMETRY_DISABLED: '1'
  # Версия образа должна совпадать с @playwright/test в package.json:
  # эталоны скриншотов сняты именно в нём (scripts/visual-docker.mjs).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble

jobs:
  quality:
    name: lint · typecheck · unit
    runs-on: ${{ fromJson((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || '["self-hosted","linux","x64","serverlink-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/ci-install.mjs pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  trainer-runtime:
    name: Go · HTML/CSS · React · Next.js (Docker)
    concurrency:
      group: lms-trainer-runtime-docker
      cancel-in-progress: false
    runs-on: ${{ fromJson((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || '["self-hosted","linux","x64","serverlink-ci"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/ci-install.mjs pnpm install --frozen-lockfile
      - run: node --test trainer-runtime/tests/*.test.mjs
      - run: pnpm test:integration:runtime --build

  integration:
    name: integration (Payload + PostgreSQL)
    runs-on: ${{ fromJson((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || '["self-hosted","linux","x64","serverlink-ci"]') }}
    timeout-minutes: 30
    container:
      image: node:22-bookworm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # scripts/test-db.mjs не поднимает свой контейнер, если адрес задан явно. Порт хоста не нужен:
      # джоба в контейнере и видит сервис по имени.
      TEST_PG_URL: postgresql://lms:lms@postgres:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/ci-install.mjs pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: e2e · api · content/a11y
    runs-on: ${{ fromJson((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || '["self-hosted","linux","x64","serverlink-ci"]') }}
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_PG_URL: postgresql://lms:lms@postgres:5432
      E2E_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-landing-${{ hashFiles('landing/package-lock.json') }}
      - run: node scripts/ci-install.mjs pnpm install --frozen-lockfile
      - run: node scripts/ci-install.mjs npm ci --prefix landing
      - run: pnpm test:e2e:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  visual:
    name: visual regression
    runs-on: ${{ fromJson((github.event.pull_request.head.repo.fork && '"ubuntu-latest"') || '["self-hosted","linux","x64","serverlink-ci"]') }}
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_PG_URL: postgresql://lms:lms@postgres:5432
      E2E_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-landing-${{ hashFiles('landing/package-lock.json') }}
      - run: node scripts/ci-install.mjs pnpm install --frozen-lockfile
      - run: node scripts/ci-install.mjs npm ci --prefix landing
      # Уже внутри контейнера Playwright: браузер и шрифты те же, что при съёмке эталонов.
      # --max-failures: каждое расхождение со скриншотом ждёт стабильный кадр до 10 с и идёт на повтор,
      # поэтому массовое расхождение (устаревшие эталоны) не укладывалось в 45 минут и джоба
      # снималась без отчёта. Теперь она падает быстро и выкладывает отчёт с отличиями.
      - run: pnpm exec playwright test --project=visual --max-failures=10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
