# Срок кеша — один заголовок на уровне server: add_header внутри location отменяет
# все add_header уровнем выше, и картинки со скриптами уходили без заголовков безопасности.
map $uri $landing_cache_control {
    ~^/_astro/                                          "public, max-age=31536000, immutable";
    ~*\.(?:ico|svg|png|jpe?g|webp|gif|woff2?|ttf|eot)$  "public, max-age=2592000";
    # HTML перепроверяется при каждом заходе: иначе браузер по эвристике часами
    # показывает версию до выката.
    # Ответ на заявку — не для кеша, свой заголовок LMS скрыт ниже, чтобы не было двух.
    ~^/api/                                             "no-store";
    default                                             "no-cache";
}

# llms*.txt - полный текст страниц для ИИ-поиска: в поисковый индекс они не нужны, иначе станут
# дублями страниц. Пустое значение nginx не отправляет, остальные адреса заголовка не получают.
map $uri $landing_robots_tag {
    ~^/llms(-full)?\.txt$  "noindex";
    default                "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name info.mentorcareer.ru _;

    root /usr/share/nginx/html;
    index index.html;

    # Без явной кодировки кириллица в llms.txt и robots.txt читается кракозябрами.
    charset utf-8;

    # Несуществующий адрес обязан отвечать 404: раньше отдавалась главная с 200,
    # и поисковики видели бесконечные дубли главной («мягкие 404»).
    error_page 404 /404.html;

    # TLS снимает Traefik: абсолютный Location вёл бы на http:// и добавлял лишний редирект.
    absolute_redirect off;

    # /index.html и //… отдавали главную с 200 — те же дубли. Проверяется $request_uri:
    # внутренний переход index на /index.html его не меняет, поэтому петли нет.
    if ($request_uri ~ "^/index\.html(?:\?|$)") {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ "^/{2,}(.*)$") {
        return 301 /$1;
    }

    # Версия nginx в заголовке Server и на страницах ошибок — готовая подсказка сканерам уязвимостей.
    server_tokens off;

    # Адрес клиента приходит в X-Forwarded-For, и журнал Docker хранил бы IP посетителей месяцами
    # (ротация только по размеру). Журнал запросов ведёт Traefik на VDS с ежедневной очисткой —
    # так и написано в политике обработки данных.
    access_log off;

    # Security headers. В location не добавлять ни одного add_header — см. map выше.
    # scripts/landing-server.mjs берёт отсюда же строки вида `add_header Имя "значение" always;`.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Срок короткий, пока HSTS обкатывается: если HTTPS сломается, браузер не пустит на сайт до его конца.
    add_header Strict-Transport-Security "max-age=86400" always;
    # Скрипты и шрифты только свои и Яндекс Метрики. 'unsafe-inline' — только стилям: CSS встроен
    # в HTML (inlineStylesheets), а метки шагов позиционируются атрибутом style. data: — пустая
    # картинка в <picture>, которая не даёт телефону качать превью кабинета.
    # Домены Метрики — METRIKA_CSP_DOMAINS и METRIKA_FRAME_ANCESTORS из src/config.ts полным
    # списком: домен сбора tag.js выбирает сам (wss — его соединения), а кабинеты Метрики
    # показывают страницу во фрейме для карты кликов. Сверяет tests/smoke/bootcampLanding.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://mc.yandex.az https://mc.yandex.by https://mc.yandex.co.il https://mc.yandex.com https://mc.yandex.com.am https://mc.yandex.com.ge https://mc.yandex.com.tr https://mc.yandex.ee https://mc.yandex.fr https://mc.yandex.kg https://mc.yandex.kz https://mc.yandex.lt https://mc.yandex.lv https://mc.yandex.md https://mc.yandex.tj https://mc.yandex.tm https://mc.yandex.uz https://mc.webvisor.com https://mc.webvisor.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.az https://mc.yandex.by https://mc.yandex.co.il https://mc.yandex.com https://mc.yandex.com.am https://mc.yandex.com.ge https://mc.yandex.com.tr https://mc.yandex.ee https://mc.yandex.fr https://mc.yandex.kg https://mc.yandex.kz https://mc.yandex.lt https://mc.yandex.lv https://mc.yandex.md https://mc.yandex.tj https://mc.yandex.tm https://mc.yandex.uz https://mc.webvisor.com https://mc.webvisor.org; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.az https://mc.yandex.by https://mc.yandex.co.il https://mc.yandex.com https://mc.yandex.com.am https://mc.yandex.com.ge https://mc.yandex.com.tr https://mc.yandex.ee https://mc.yandex.fr https://mc.yandex.kg https://mc.yandex.kz https://mc.yandex.lt https://mc.yandex.lv https://mc.yandex.md https://mc.yandex.tj https://mc.yandex.tm https://mc.yandex.uz https://mc.webvisor.com https://mc.webvisor.org wss://mc.yandex.ru wss://mc.yandex.az wss://mc.yandex.by wss://mc.yandex.co.il wss://mc.yandex.com wss://mc.yandex.com.am wss://mc.yandex.com.ge wss://mc.yandex.com.tr wss://mc.yandex.ee wss://mc.yandex.fr wss://mc.yandex.kg wss://mc.yandex.kz wss://mc.yandex.lt wss://mc.yandex.lv wss://mc.yandex.md wss://mc.yandex.tj wss://mc.yandex.tm wss://mc.yandex.uz wss://mc.webvisor.com wss://mc.webvisor.org; frame-src https://mc.yandex.ru https://mc.yandex.az https://mc.yandex.by https://mc.yandex.co.il https://mc.yandex.com https://mc.yandex.com.am https://mc.yandex.com.ge https://mc.yandex.com.tr https://mc.yandex.ee https://mc.yandex.fr https://mc.yandex.kg https://mc.yandex.kz https://mc.yandex.lt https://mc.yandex.lv https://mc.yandex.md https://mc.yandex.tj https://mc.yandex.tm https://mc.yandex.uz https://mc.webvisor.com https://mc.webvisor.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://metrika.yandex.ru https://analytics.yandex.by https://analytics.yandex.com https://analytics.yandex.com.tr https://analytics.yandex.kz https://analytics.yandex.ru https://metr.yandex.by https://metr.yandex.com https://metr.yandex.com.tr https://metr.yandex.kz https://metr.yandex.ru https://metrica.ya.ru https://metrica.yandex https://metrica.yandex.by https://metrica.yandex.com https://metrica.yandex.com.tr https://metrica.yandex.kz https://metrica.yandex.ru https://metrika.ya.ru https://metrika.yandex https://metrika.yandex.by https://metrika.yandex.com https://metrika.yandex.com.tr https://metrika.yandex.kz https://metrika.yandex.uz" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cache-Control $landing_cache_control;
    add_header X-Robots-Tag $landing_robots_tag;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Страницы-каталоги — только адресом с косой чертой: иначе та же страница отвечала бы двумя адресами.
    location ~ ^/(bootcamp/nodejs|bootcamp/nodejs/payment|bootcamp/nodejs/offer|bootcamp/nodejs/quality|bootcamp/nodejs/program|bootcamp/nodejs/format|privacy|consent)$ {
        return 301 /$1/$is_args$args;
    }

    # Заявки формы предзаписи идут в LMS той же сетью Docker: форма и API на одном origin,
    # CORS не нужен. Имя сервиса резолвится при запросе, а не на старте — без LMS лендинг
    # всё равно поднимется, а форма ответит 502 и предложит повторить.
    location = /api/bootcamp/leads {
        limit_except POST { deny all; }
        # Анкета и файл резюме до 5 МБ; точный предел проверяет LMS при чтении.
        client_max_body_size 6m;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $lms_app http://lms-mentor-app:3000;
        proxy_pass $lms_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Traefik уже дописал адрес клиента последним, по нему LMS считает лимит. Свой адрес
        # (Traefik внутри сети) nginx не добавляет — иначе все заявки делили бы один лимит.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
