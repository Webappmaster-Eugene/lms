# Срок кеша — один заголовок на уровне server: add_header внутри location отменяет
# все add_header уровнем выше, и картинки со скриптами уходили без заголовков безопасности.
map $uri $landing_cache_control {
    ~^/_astro/                                          "public, max-age=31536000, immutable";
    ~*\.(?:ico|svg|png|jpe?g|webp|gif|woff2?|ttf|eot)$  "public, max-age=2592000";
    # HTML перепроверяется при каждом заходе: иначе браузер по эвристике часами
    # показывает версию до выката.
    default                                             "no-cache";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name info.mentorcareer.ru _;

    root /usr/share/nginx/html;
    index index.html;

    # Без явной кодировки кириллица в llms.txt и robots.txt читается кракозябрами.
    charset utf-8;

    # Несуществующий адрес обязан отвечать 404: раньше отдавалась главная с 200,
    # и поисковики видели бесконечные дубли главной («мягкие 404»).
    error_page 404 /404.html;

    # TLS снимает Traefik: абсолютный Location вёл бы на http:// и добавлял лишний редирект.
    absolute_redirect off;

    # /index.html и //… отдавали главную с 200 — те же дубли. Проверяется $request_uri:
    # внутренний переход index на /index.html его не меняет, поэтому петли нет.
    if ($request_uri ~ "^/index\.html(?:\?|$)") {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ "^/{2,}(.*)$") {
        return 301 /$1;
    }

    # Версия nginx в заголовке Server и на страницах ошибок — готовая подсказка сканерам уязвимостей.
    server_tokens off;

    # Security headers. В location не добавлять ни одного add_header — см. map выше.
    # scripts/landing-server.mjs берёт отсюда же строки вида `add_header Имя "значение" always;`.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Срок короткий, пока HSTS обкатывается: если HTTPS сломается, браузер не пустит на сайт до его конца.
    add_header Strict-Transport-Security "max-age=86400" always;
    # Скрипты и шрифты только свои. 'unsafe-inline' — только стилям: CSS встроен в HTML
    # (inlineStylesheets), а метки шагов позиционируются атрибутом style. data: — пустая
    # картинка в <picture>, которая не даёт телефону качать превью кабинета.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cache-Control $landing_cache_control;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
